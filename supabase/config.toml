# Google Calendar fetches the program feed and cannot send a Supabase key.
# JWT verification stays off for this function only. The private token in the
# URL is what keeps one person's calendar from opening another person's.
# Do not deploy until the owner approves it.

[functions.calendar-feed]
verify_jwt = false

# Stripe sends webhooks with no Supabase user. The signature is the check.
# Checkout and the billing portal require the signed-in person's JWT.
# Do not deploy these until the owner says so.

[functions.stripe-webhook]
verify_jwt = false

[functions.create-checkout-session]
verify_jwt = true

[functions.create-portal-session]
verify_jwt = true
